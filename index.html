<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Teachable Machine Image Model</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: "MS Sans Serif", Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #e0e7ef 0%, #f5f7fa 100%);
    color: #222;
    min-height: 100vh;
  }
  .center-container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .center-container > * {
    margin: 16px 0;
    width: 100%;
    max-width: 400px;
    text-align: center;
    line-height: 1.7;
  }
  button {
    background: #1976d2;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px 32px;
    font-size: 1.1rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 12px;
  }
  button:hover {
    background: #125ea2;
  }
  #webcam-container, #label-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .api-key-section {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-top: 20px;
  }
  .api-key-section h3 {
    margin-top: 0;
    color: #1976d2;
  }
  .api-key-display {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    align-items: center;
  }
  .api-key-input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.9rem;
    background: #f5f5f5;
  }
  .copy-btn {
    padding: 10px 20px;
    background: #4caf50;
    margin: 0;
  }
  .copy-btn:hover {
    background: #45a049;
  }
  .hidden {
    display: none;
  }
  @media (max-width: 600px) {
    .center-container {
      padding: 8px;
    }
    .center-container > * {
      max-width: 98vw;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px 0;
    }
  }
</style>
</head>

<body>
<div class="center-container">

	<div style="font-size:1.4rem; font-weight:bold;">Teachable Machine Image Model</div>
	
	<!-- API Key Section -->
	<div class="api-key-section">
		<h3>API Key</h3>
		<p>Generate your API key to access the ML model programmatically.</p>
		<button type="button" onclick="generateApiKey()">Generate My API Key</button>
		<div id="api-key-display" class="api-key-display hidden">
			<input type="text" id="api-key-input" class="api-key-input" readonly>
			<button class="copy-btn" onclick="copyApiKey(event)">Copy</button>
		</div>
	</div>
	
	<button id="start-btn" type="button" onclick="init()">Start</button>
	<div id="webcam-container"></div>
	<div id="label-container"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script type="text/javascript">
    // More API functions here:
    // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/image

    // the link to your model provided by Teachable Machine export panel
    const URL = "https://teachablemachine.withgoogle.com/models/dg4O-MW0W/";

    let model, webcam, labelContainer, maxPredictions;

    // Load the image model and setup the webcam
    async function init() {
		
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // load the model and metadata
        // Refer to tmImage.loadFromFiles() in the API to support files from a file picker
        // or files from your local hard drive
        // Note: the pose library adds "tmImage" object to your window (window.tmImage)
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Convenience function to setup a webcam
        const flip = true; // whether to flip the webcam
        webcam = new tmImage.Webcam(300, 300, flip); // width, height, flip
        await webcam.setup(); // request access to the webcam
        await webcam.play();
        window.requestAnimationFrame(loop);

        // append elements to the DOM
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) { // and class labels
            labelContainer.appendChild(document.createElement("div"));
        }
		document.getElementById("start-btn").disabled = true;
		startRecognitionHistory();
		
    }

    async function loop() {
        webcam.update(); // update the webcam frame
        await predict();
        window.requestAnimationFrame(loop);
    }

    // run the webcam image through the image model
    async function predict() {
        // predict can take in an image, video or canvas html element
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const classPrediction =
                prediction[i].className + ": " + prediction[i].probability.toFixed(2);
            labelContainer.childNodes[i].innerHTML = classPrediction;
        }
    }
	
	
	
	let recognitionHistory = [];
	let recognitionIntervalId = null;

// API Key Generation
function generateApiKey() {
    // Check if crypto API is available
    if (!window.crypto || !window.crypto.getRandomValues) {
        alert('Your browser does not support secure random number generation. Please use a modern browser.');
        return;
    }
    
    // Generate a random API key using crypto API for better randomness
    const array = new Uint8Array(32);
    crypto.getRandomValues(array);
    // Convert byte array to 64-character hex string
    const apiKey = Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
    
    // Display the API key
    document.getElementById('api-key-input').value = apiKey;
    document.getElementById('api-key-display').classList.remove('hidden');
    
    // Store in localStorage for persistence
    localStorage.setItem('mltest-api-key', apiKey);
}

function copyApiKey(event) {
    const apiKeyInput = document.getElementById('api-key-input');
    apiKeyInput.select();
    apiKeyInput.setSelectionRange(0, apiKeyInput.value.length); // Select entire API key
    
    // Try modern clipboard API first
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(apiKeyInput.value).then(() => {
            const copyBtn = event.target;
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            setTimeout(() => {
                copyBtn.textContent = originalText;
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy:', err);
            fallbackCopy(apiKeyInput, event.target);
        });
    } else {
        // Fallback for older browsers
        fallbackCopy(apiKeyInput, event.target);
    }
}

function fallbackCopy(input, button) {
    try {
        input.select();
        // Using deprecated execCommand for legacy browser support
        document.execCommand('copy');
        const originalText = button.textContent;
        button.textContent = 'Copied!';
        setTimeout(() => {
            button.textContent = originalText;
        }, 2000);
    } catch (err) {
        console.error('Fallback copy failed:', err);
        alert('Failed to copy API key. Please copy manually.');
    }
}

// Load existing API key on page load
window.addEventListener('DOMContentLoaded', () => {
    const existingKey = localStorage.getItem('mltest-api-key');
    if (existingKey) {
        document.getElementById('api-key-input').value = existingKey;
        document.getElementById('api-key-display').classList.remove('hidden');
    }
});

function startRecognitionHistory() {
    recognitionIntervalId = setInterval(saveRecognition, 2000);
}

function saveRecognition() {
    if (!labelContainer) return;
    let currentRecognition = [];
    for (let i = 0; i < maxPredictions; i++) {
        currentRecognition.push(labelContainer.childNodes[i].innerHTML);
    }
    const now = new Date().toLocaleString();
	recognitionHistory.push(`[${now}] ${currentRecognition.join(", ")}`);
    updateRecognitionHistory();
}

function updateRecognitionHistory() {
    let historyContainer = document.getElementById("recognition-history");
    if (!historyContainer) {
        historyContainer = document.createElement("div");
        historyContainer.id = "recognition-history";
        labelContainer.parentNode.appendChild(historyContainer);
    }
    historyContainer.innerHTML = "<b>Recognition History:</b><br>" + recognitionHistory.map(item => `<div>${item}</div>`).join("");
}
	
</script>

</body>
</html>
